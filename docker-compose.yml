version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: sgpe_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: sgpe
      MYSQL_USER: ${DB_USER:-sgpe_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sgpe_pass}
    ports:
      - "3306:3306"
    volumes:
      - sgpe_mysql_data:/var/lib/mysql
      - ./database/mysql.cnf:/etc/mysql/conf.d/sgpe.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sgpe_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER:-sgpe_user}:${DB_PASSWORD:-sgpe_pass}@mysql:3306/sgpe
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups

volumes:
  sgpe_mysql_data:
